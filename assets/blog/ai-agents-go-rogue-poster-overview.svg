<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">When AI Agents Go Rogue: Who Protects Your Files?</title>
<desc id="desc">Research poster overview: root-privileged AI agents bypass tested file-system, kernel eBPF LSM, and block-device protections; hardware-enforced protection is proposed as future direction.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07172f"/><stop offset="1" stop-color="#092c48"/></linearGradient></defs>
<rect width="1200" height="650" rx="24" fill="url(#bg)"/>
<rect x="34" y="32" width="1132" height="96" rx="14" fill="#144f98"/>
<text x="600" y="74" text-anchor="middle" font-size="35" font-family="Arial,sans-serif" font-weight="700" fill="#fff">When AI Agents Go Rogue:</text>
<text x="600" y="112" text-anchor="middle" font-size="35" font-family="Arial,sans-serif" font-weight="700" fill="#fff">Who Protects Your Files?</text>
<text x="600" y="163" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#d2e7f4">Zedong Zhou · Niusen Chen · University of Nevada, Reno</text>
<rect x="38" y="196" width="335" height="320" rx="15" fill="#112d49" stroke="#507da4"/>
<text x="206" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">Threat Model</text>
<rect x="93" y="260" width="220" height="56" rx="11" fill="#214e78"/>
<text x="203" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#fff">Root-privileged AI Agent</text>
<path d="M203 324v68m-10-12 10 13 10-13" fill="none" stroke="#fc909e" stroke-width="4"/>
<rect x="93" y="398" width="220" height="66" rx="11" fill="#712b43" stroke="#ff7d92"/>
<text x="203" y="427" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#fff">Protected local file</text>
<text x="203" y="451" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#ffc1c8">Deleted / Modified</text>
<rect x="399" y="196" width="760" height="320" rx="15" fill="#102b45" stroke="#507da4"/>
<text x="779" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">Three Tested Host-Side Layers</text>
<g font-family="Arial,sans-serif">
<rect x="424" y="260" width="221" height="190" rx="14" fill="#123f6d" stroke="#66b4ff" stroke-width="2"/>
<text x="534" y="296" text-anchor="middle" fill="#d5edff" font-size="19" font-weight="700">01 / File system</text>
<text x="534" y="335" text-anchor="middle" fill="#fff" font-size="18">Immutable attribute</text>
<text x="534" y="363" text-anchor="middle" fill="#fff" font-size="17">chattr</text>
<text x="534" y="407" text-anchor="middle" fill="#ffb0b5" font-size="20" font-weight="700">Bypassed</text>
<rect x="669" y="260" width="221" height="190" rx="14" fill="#183d70" stroke="#a698ff" stroke-width="2"/>
<text x="779" y="296" text-anchor="middle" fill="#e5dfff" font-size="19" font-weight="700">02 / Kernel</text>
<text x="779" y="335" text-anchor="middle" fill="#fff" font-size="18">eBPF LSM hook</text>
<text x="779" y="363" text-anchor="middle" fill="#fff" font-size="17">Unloaded / modified</text>
<text x="779" y="407" text-anchor="middle" fill="#ffb0b5" font-size="20" font-weight="700">Bypassed</text>
<rect x="914" y="260" width="221" height="190" rx="14" fill="#174b51" stroke="#79e8c8" stroke-width="2"/>
<text x="1024" y="296" text-anchor="middle" fill="#d4fff1" font-size="19" font-weight="700">03 / Block device</text>
<text x="1024" y="335" text-anchor="middle" fill="#fff" font-size="18">Read-only setting</text>
<text x="1024" y="363" text-anchor="middle" fill="#fff" font-size="17">Remount / change</text>
<text x="1024" y="407" text-anchor="middle" fill="#ffb0b5" font-size="20" font-weight="700">Bypassed</text>
</g>
<rect x="38" y="538" width="1121" height="80" rx="12" fill="#0a5959" stroke="#66dccc"/>
<text x="600" y="572" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">Key finding: host-controlled defenses do not establish an independent security boundary.</text>
<text x="600" y="599" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#c6fff4">Future directions: trusted execution environments (TEE) and flash-enforced protection</text>
</svg>