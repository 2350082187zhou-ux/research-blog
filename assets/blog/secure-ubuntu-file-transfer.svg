<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Secure file transfer between Windows and Ubuntu</title>
<desc id="desc">Windows computer and Ubuntu virtual machine exchange experiment files through an encrypted SSH connection using SCP or SFTP. All identities are fictional.</desc>
