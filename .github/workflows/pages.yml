name: Deploy Cybersecurity Blog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cybersecurity-blog-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out blog source
        uses: actions/checkout@v4
      - name: Set up Ruby and install dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # Conference data is owned by the academic website; both sites render
      # the same checked/source-labeled deadlines after deployment.
      - name: Mirror security conference data from academic site
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch master https://github.com/2350082187zhou-ux/2350082187zhou-ux.github.io.git "$RUNNER_TEMP/academic-reference"
          for file in security_ccf.yml security_deadlines.yml security_deadlines_auto.json; do
            test -s "$RUNNER_TEMP/academic-reference/_data/$file"
            cp "$RUNNER_TEMP/academic-reference/_data/$file" "_data/$file"
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl ""
      - name: Validate the built blog
        run: |
          test -s _site/index.html
          grep -q 'Exploring the' _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
